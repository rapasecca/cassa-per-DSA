<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cassa Veloce">
  <meta name="description" content="Calcola rapidamente il resto e i tagli da dare.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Cassa Veloce — Preview</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: rgba(19, 29, 36, 0.92);
      --panel-2: rgba(25, 35, 43, 0.95);
      --border: rgba(255,255,255,0.08);
      --text: #edf3f7;
      --muted: #9bb1c2;
      --primary: #3aa0ff;
      --accent: #ffcb52;
      --success: #36d399;
      --danger: #ff6b6b;
      --warn: #ffb454;
      --shadow: 0 16px 32px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at top, rgba(58,160,255,0.16), transparent 28%),
        linear-gradient(180deg, #10181d 0%, #0d1318 100%);
    }

    button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, .92fr);
      gap: 14px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-left { padding: 16px 16px 14px; }
    .panel-right {
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(23,32,40,.96), rgba(17,24,31,.95));
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(58,160,255,0.14);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid rgba(58,160,255,.25);
    }

    .num-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .num-btn, .denom-btn, .action-btn {
      border: 1px solid rgba(255,255,255,0.07);
      cursor: pointer;
      color: var(--text);
      border-radius: 16px;
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
      user-select: none;
    }

    .num-btn:active, .denom-btn:active, .action-btn:active {
      transform: scale(.98);
      filter: brightness(1.15);
    }

    .num-btn {
      min-height: 58px;
      background: linear-gradient(180deg, rgba(49,62,73,.98), rgba(29,38,45,.98));
      font-size: clamp(1.2rem, 3.5vw, 1.68rem);
      font-weight: 800;
    }

    .money-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .denom-btn {
      min-height: 56px;
      font-weight: 800;
      font-size: 0.98rem;
      padding: 8px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .denom-btn.banknote { background: linear-gradient(180deg, rgba(46,159,91,.92), rgba(19,104,58,.96)); }
    .denom-btn.coin { background: linear-gradient(180deg, rgba(217,168,39,.98), rgba(163,117,9,.98)); color: #1a1300; }
    .denom-btn.undo { background: linear-gradient(180deg, rgba(91,100,111,.88), rgba(62,69,78,.96)); color: #f7f7f7; }

    .sum-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      margin-top: 10px;
    }

    .summary-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
      font-size: 0.96rem;
      color: var(--muted);
    }

    .summary-line strong {
      color: var(--text);
      font-size: 1.02rem;
      text-align: right;
    }

    .amount-display {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 900;
      text-align: right;
      color: var(--accent);
      letter-spacing: .02em;
    }

    .mini-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
      margin: 12px 0 8px;
    }

    .breakdown {
      min-height: 54px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      padding: 8px 10px;
    }

    .coin-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .coin-tag.banknote { background: linear-gradient(180deg, rgba(47,159,91,.95), rgba(19,108,58,.95)); }
    .coin-tag.coin { background: linear-gradient(180deg, rgba(217,168,39,.96), rgba(163,117,9,.96)); color: #1d1400; }

    .coin-tag .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
      border-radius: 999px;
      background: rgba(0,0,0,.17);
      padding: 0 6px;
      font-size: 0.72rem;
      font-weight: 900;
    }

    .tip-box {
      margin-top: 12px;
      display: none;
      background: rgba(255,180,84,0.08);
      border: 1px solid rgba(255,180,84,0.35);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .tip-box.show { display: block; }

    .tip-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 800;
      color: var(--warn);
      margin-bottom: 4px;
    }

    .tip-text {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .history-box {
      margin-top: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-height: 162px;
      overflow-y: auto;
      padding: 8px 10px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      padding: 6px 0;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .history-item:last-child { border-bottom: 0; }
    .history-item strong { color: var(--accent); }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .action-btn {
      min-height: 54px;
      font-weight: 900;
      font-size: 0.98rem;
      border-radius: 16px;
      color: white;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .action-btn.primary { background: linear-gradient(180deg, rgba(54,211,153,.94), rgba(23,131,89,.96)); }
    .action-btn.secondary { background: linear-gradient(180deg, rgba(255,107,107,.94), rgba(177,58,58,.96)); }

    .empty-msg {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
      padding: 6px 0;
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .panel-right { order: -1; }
      body { padding-top: max(14px, env(safe-area-inset-top)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel panel-left" aria-label="Inserimento importi">
      <div class="section-top">
        <h1 class="section-label">1. Totale</h1>
        <span class="badge">€</span>
      </div>
      <div class="num-grid" aria-label="Tastierino numerico">
        <button class="num-btn" data-key="1">1</button>
        <button class="num-btn" data-key="2">2</button>
        <button class="num-btn" data-key="3">3</button>
        <button class="num-btn" data-key="4">4</button>
        <button class="num-btn" data-key="5">5</button>
        <button class="num-btn" data-key="6">6</button>
        <button class="num-btn" data-key="7">7</button>
        <button class="num-btn" data-key="8">8</button>
        <button class="num-btn" data-key="9">9</button>
        <button class="num-btn" data-key=".">.</button>
        <button class="num-btn" data-key="0">0</button>
        <button class="num-btn" data-key="del" aria-label="Cancella ultima cifra">⌫</button>
      </div>

      <div class="section-top" style="margin-top:18px;">
        <h2 class="section-label">2. Ricevuto</h2>
        <span class="badge">€</span>
      </div>
      <div class="money-grid" aria-label="Denaro ricevuto">
        <button class="denom-btn banknote" data-money="500">€5</button>
        <button class="denom-btn banknote" data-money="1000">€10</button>
        <button class="denom-btn banknote" data-money="2000">€20</button>
        <button class="denom-btn banknote" data-money="5000">€50</button>
        <button class="denom-btn banknote" data-money="10000">€100</button>
        <button class="denom-btn undo" id="undoMoney">Annulla</button>
        <button class="denom-btn coin" data-money="200">€2</button>
        <button class="denom-btn coin" data-money="100">€1</button>
        <button class="denom-btn coin" data-money="50">50¢</button>
        <button class="denom-btn coin" data-money="20">20¢</button>
        <button class="denom-btn coin" data-money="10">10¢</button>
        <button class="denom-btn coin" data-money="5">5¢</button>
        <button class="denom-btn coin" data-money="2">2¢</button>
        <button class="denom-btn coin" data-money="1">1¢</button>
      </div>
    </section>

    <aside class="panel panel-right" aria-label="Risultato del calcolo">
      <div>
        <div class="section-top">
          <h2 class="section-label">Cassa</h2>
          <span class="badge">Live</span>
        </div>

        <div class="sum-box">
          <div class="summary-line"><span>Totale</span><strong id="totaleText">€0,00</strong></div>
          <div class="summary-line"><span>Pagato</span><strong id="pagatoText" style="color: var(--primary);">€0,00</strong></div>
          <div class="summary-line" id="mancanteRow" style="display:none;"><span>Mancano</span><strong id="mancanteText" style="color: var(--warn);">€0,00</strong></div>
        </div>

        <div class="amount-display" id="restoText" aria-live="polite">RESTO: €0,00</div>

        <div class="mini-label">Pezzi da dare</div>
        <div class="breakdown" id="breakdownContainer">
          <span class="empty-msg">- In attesa -</span>
        </div>

        <div class="tip-box" id="tipBox">
          <div class="tip-title">Trucco spiccioli</div>
          <div class="tip-text" id="tipText">-</div>
        </div>

        <div class="mini-label">Ultimi conti</div>
        <div class="history-box" id="historyBox">
          <div class="empty-msg" style="padding:10px 0;">Nessuna operazione ancora</div>
        </div>
      </div>

      <div class="action-row">
        <button class="action-btn primary" id="calculate">Calcola</button>
        <button class="action-btn secondary" id="reset">Reset</button>
      </div>
    </aside>
  </div>

  <script>
    'use strict';
    let totalInput = '';
    let received = [];
    let history = [];
    let wakeLock = null;
    const $ = (id) => document.getElementById(id);
    const euro = (cents) => '€' + (cents / 100).toFixed(2).replace('.', ',');
    const totalCents = () => Math.round(Number(totalInput || 0) * 100);
    const paidCents = () => received.reduce((sum, cents) => sum + cents, 0);

    function updatePaid() {
      const paid = paidCents();
      $('pagatoText').textContent = euro(paid);
      if (totalInput) {
        const due = totalCents() - paid;
        $('mancanteRow').style.display = due > 0 ? 'flex' : 'none';
        $('mancanteText').textContent = euro(Math.max(due, 0));
      } else {
        $('mancanteRow').style.display = 'none';
      }
    }

    function addKey(key) {
      if (key === 'del') {
        totalInput = totalInput.slice(0, -1);
      } else if (key === '.') {
        if (!totalInput.includes('.')) totalInput += totalInput ? '.' : '0.';
      } else {
        if (totalInput.includes('.') && totalInput.split('.')[1].length >= 2) return;
        totalInput += key;
      }
      let display = totalInput ? totalInput.replace('.', ',') : '0,00';
      if (totalInput.includes('.') && totalInput.split('.')[1].length === 1) display += '0';
      $('totaleText').textContent = '€' + display;
      updatePaid();
    }

    function drawChange(cents) {
      const denominations = [
        [5000, '50 €', 'banknote'], [2000, '20 €', 'banknote'], [1000, '10 €', 'banknote'], [500, '5 €', 'banknote'],
        [200, '2 €', 'coin'], [100, '1 €', 'coin'], [50, '50 ¢', 'coin'], [20, '20 ¢', 'coin'],
        [10, '10 ¢', 'coin'], [5, '5 ¢', 'coin'], [2, '2 ¢', 'coin'], [1, '1 ¢', 'coin']
      ];
      const container = $('breakdownContainer');
      container.innerHTML = '';
      let remainder = cents;
      for (const [value, label, type] of denominations) {
        const quantity = Math.floor(remainder / value);
        if (!quantity) continue;
        const tag = document.createElement('div');
        tag.className = `coin-tag ${type}`;
        tag.innerHTML = `${label}<span class="count">x${quantity}</span>`;
        container.appendChild(tag);
        remainder %= value;
      }
    }

    function addToHistory(total, paid, change) {
      history.unshift({ total: euro(total), paid: euro(paid), change: euro(change) });
      history = history.slice(0, 5);
      const box = $('historyBox');
      box.innerHTML = history.map(item => `
        <div class="history-item">
          <span>Tot: ${item.total}<br>Pag: ${item.paid}</span>
          <strong>Resto: ${item.change}</strong>
        </div>
      `).join('');
    }

    function showTip(total, paid) {
      const cents = total % 100;
      const box = $('tipBox');
      const text = $('tipText');
      if (cents > 0 && paid >= 500) {
        const missing = 100 - cents;
        text.textContent = missing <= 50 ? `Chiedi ${missing}¢ al cliente` : `Chiedi 1 euro (o ${missing}¢)`;
        box.classList.add('show');
      } else {
        box.classList.remove('show');
      }
    }

    function calculate() {
      if (!totalInput || !Number.isFinite(Number(totalInput))) {
        alert('Inserisci prima il totale!');
        return;
      }

      const total = totalCents();
      const paid = paidCents();
      const change = paid - total;

      $('pagatoText').textContent = euro(paid);
      $('mancanteRow').style.display = 'none';

      if (change < 0) {
        $('restoText').textContent = `MANCANO: ${euro(-change)}`;
        $('breakdownContainer').innerHTML = '<span class="empty-msg" style="color: var(--danger);">Soldi insufficienti!</span>';
        $('tipBox').classList.remove('show');
        return;
      }

      if (change === 0) {
        $('restoText').textContent = 'RESTO: €0,00';
        $('breakdownContainer').innerHTML = '<span class="empty-msg" style="color: var(--success);">Conto perfetto!</span>';
        $('tipBox').classList.remove('show');
      } else {
        $('restoText').textContent = `RESTO: ${euro(change)}`;
        drawChange(change);
        showTip(total, paid);
      }

      addToHistory(total, paid, change);
    }

    function reset() {
      totalInput = '';
      received = [];
      $('totaleText').textContent = '€0,00';
      $('pagatoText').textContent = '€0,00';
      $('mancanteRow').style.display = 'none';
      $('restoText').textContent = 'RESTO: €0,00';
      $('breakdownContainer').innerHTML = '<span class="empty-msg">- In attesa -</span>';
      $('tipBox').classList.remove('show');
    }

    document.querySelectorAll('[data-key]').forEach((button) => {
      button.addEventListener('click', () => addKey(button.dataset.key));
    });

    document.querySelectorAll('[data-money]').forEach((button) => {
      button.addEventListener('click', () => {
        received.push(Number(button.dataset.money));
        updatePaid();
      });
    });

    $('undoMoney').addEventListener('click', () => {
      received.pop();
      updatePaid();
    });

    $('calculate').addEventListener('click', calculate);
    $('reset').addEventListener('click', reset);

    document.addEventListener('click', async () => {
      if ('wakeLock' in navigator && !wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (_) {}
      }
    }, { once: true });

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
